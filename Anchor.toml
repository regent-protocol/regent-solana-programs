# ============================================================================
# Anchor.toml — Workspace configuration for Regent Protocol Solana programs
# ============================================================================
#
# This file tells the Anchor framework:
#   1. Which programs to compile and deploy
#   2. Which Solana cluster to target (localnet, devnet, mainnet)
#   3. Which wallet to use for deployment
#   4. Where test files live
#
# To deploy:
#   anchor build                     # compile all programs
#   anchor deploy --provider.cluster devnet   # deploy to devnet
#   anchor test                      # run tests on local validator

[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# ---------------------------------------------------------------------------
# Programs — each maps a program name to its keypair (generated on first build)
# The keypair file contains the program's address (public key).
# ---------------------------------------------------------------------------
[programs.localnet]
agent_registry = "5jBmqyeo1vUAjHbEFuY59NMGTQR8cEe9Jvz2uCwCjp3L"
audit_anchor = "8N1PpbJZKmvJjG86XWpP82XrWzp8HY5FHZuzyQTgjJas"
mandate_registry = "8HAzw3UFGmabsHJkAsuGLfBZG8djYQ3J1FRNUVjkseMr"

[programs.devnet]
agent_registry = "5jBmqyeo1vUAjHbEFuY59NMGTQR8cEe9Jvz2uCwCjp3L"
audit_anchor = "8N1PpbJZKmvJjG86XWpP82XrWzp8HY5FHZuzyQTgjJas"
mandate_registry = "8HAzw3UFGmabsHJkAsuGLfBZG8djYQ3J1FRNUVjkseMr"

[programs.mainnet]
agent_registry = "5jBmqyeo1vUAjHbEFuY59NMGTQR8cEe9Jvz2uCwCjp3L"
audit_anchor = "8N1PpbJZKmvJjG86XWpP82XrWzp8HY5FHZuzyQTgjJas"
mandate_registry = "8HAzw3UFGmabsHJkAsuGLfBZG8djYQ3J1FRNUVjkseMr"

# ---------------------------------------------------------------------------
# Provider — which cluster and wallet to use
# ---------------------------------------------------------------------------
[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
