[package]
name = "audit-anchor"
version = "0.1.0"
description = "Regent Protocol — Merkle root anchoring for tamper-proof audit trails"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { workspace = true }
