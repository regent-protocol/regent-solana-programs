[package]
name = "agent-registry"
version = "0.1.0"
description = "Regent Protocol — AgentID on-chain registry for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
# cdylib = compiled dynamic library (what Solana loads as a program)
# lib    = regular library (for tests and other crates to import)

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { workspace = true }
